<style>
/* Layout: answer-sheet strip + 10-day timetable; day pages use OMR-bubble answer rows */
:root{
  --paper:#F5F7F4; --surface:#FFFFFF; --ink:#1B2526; --muted:#5A6968; --line:#D8DFDB;
  --accent:#0D6A64; --accent-ink:#FFFFFF; --accent-soft:#E1EFEC;
  --graphite:#2C3436; --ok:#1C7A4A; --ok-soft:#E2F2E8; --bad:#B02E25; --bad-soft:#FBE6E3;
  --tip:#FFF3C9; --tip-line:#C9A400; --key:#E4EDF9; --key-line:#2E5C9A;
  --seg1:#0D6A64; --seg2:#3E8E7E; --seg3:#7FB3A3;
  --display:'Bai Jamjuree','Sarabun','Leelawadee UI',Tahoma,sans-serif;
  --body:'Sarabun','Leelawadee UI',Tahoma,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111716; --surface:#192120; --ink:#E5ECEA; --muted:#9BA9A7; --line:#2D3A38;
  --accent:#55BDB3; --accent-ink:#0B1413; --accent-soft:#16312F;
  --graphite:#DCE3E1; --ok:#62C690; --ok-soft:#163024; --bad:#F2837A; --bad-soft:#3A1D1A;
  --tip:#352F17; --tip-line:#C9A400; --key:#1B2638; --key-line:#7FA6E0;
  --seg1:#55BDB3; --seg2:#3E8E7E; --seg3:#2F665C; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#111716; --surface:#192120; --ink:#E5ECEA; --muted:#9BA9A7; --line:#2D3A38;
  --accent:#55BDB3; --accent-ink:#0B1413; --accent-soft:#16312F;
  --graphite:#DCE3E1; --ok:#62C690; --ok-soft:#163024; --bad:#F2837A; --bad-soft:#3A1D1A;
  --tip:#352F17; --tip-line:#C9A400; --key:#1B2638; --key-line:#7FA6E0;
  --seg1:#55BDB3; --seg2:#3E8E7E; --seg3:#2F665C; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:880px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700}
h2{font-size:1.35rem;font-weight:600}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
.brand .dot{width:22px;height:22px;border-radius:50%;background:var(--graphite);box-shadow:inset 0 0 0 3px var(--paper),0 0 0 2px var(--graphite)}
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 14px;color:var(--ink)}

/* answer-sheet strip */
.sheet{display:flex;flex-direction:column;gap:10px}
.strip{display:grid;grid-template-columns:20fr 40fr 20fr;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.seg{padding:12px 12px 10px;color:#fff;min-width:0}
.seg:nth-child(1){background:var(--seg1)} .seg:nth-child(2){background:var(--seg2)} .seg:nth-child(3){background:var(--seg3);color:#fff}
.seg b{font-family:var(--display);display:block;font-size:1rem}
.seg span{font-family:var(--mono);font-size:.8rem;opacity:.95}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:.95rem}
.facts strong{font-family:var(--mono);font-weight:500}

/* timetable */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.day{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;color:var(--ink);width:100%}
.day:hover:not(.locked){border-color:var(--accent)}
.day.locked{opacity:.62;cursor:not-allowed}
.bub{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--graphite);display:grid;place-items:center;font-family:var(--mono);font-size:.95rem}
.day.done .bub{background:var(--graphite);color:var(--paper)}
.day.locked .bub{border-style:dashed}
.day .t{font-family:var(--display);font-weight:600;line-height:1.3}
.day .s{font-size:.85rem;color:var(--muted)}
.state{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.state.open{color:var(--accent)} .state.done{color:var(--ok)}

/* day page */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:8px 12px;color:var(--muted);font-family:var(--display);font-weight:600}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.clean{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.call{border-left:5px solid var(--tip-line);background:var(--tip);border-radius:6px;padding:12px 14px}
.call.key{border-left-color:var(--key-line);background:var(--key)}
.call.warn{border-left-color:var(--bad);background:var(--bad-soft)}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.bk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.bk h3{font-size:1.02rem}
.bk .use{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.ex-list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ex-list li{display:flex;flex-direction:column;border-top:1px dashed var(--line);padding-top:5px}
.ex-list .en{font-weight:600;line-height:1.4}
.ex-list .th{font-size:.9rem;color:var(--muted);line-height:1.4}
.lbl{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.chip{font-family:var(--mono);font-size:.75rem;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:3px 12px;background:var(--surface)}
.listen{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font-family:var(--display);font-weight:600;color:var(--muted)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* flashcards */
.fc-wrap{display:flex;flex-direction:column;gap:12px;align-items:center}
.fc{width:100%;max-width:520px;min-height:200px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center;color:var(--ink)}
.fc .w{font-family:var(--display);font-size:1.9rem;font-weight:700}
.fc .pos{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.fc .m{font-size:1.3rem;font-weight:600}
.fc .ex{font-style:italic;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}

/* questions */
.mode{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;font-family:'Sarabun',Georgia,serif}
.passage .sit{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.dl b{font-family:var(--display)}
.q{display:flex;flex-direction:column;gap:8px}
.q .stem{font-weight:600}
.q .stem .n{font-family:var(--mono);margin-right:8px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink);width:100%}
.opt .b{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--graphite);display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;margin-top:1px}
.opt.sel .b{background:var(--graphite);color:var(--paper)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .b{border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.exp{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:6px;font-size:.97rem;display:flex;flex-direction:column;gap:4px}
.timer{font-family:var(--mono);font-size:1.05rem;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.score{font-family:var(--display);font-size:2rem;font-weight:700}
.lock{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
footer{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (max-width:520px){.strip{grid-template-columns:1fr}.dl{grid-template-columns:1fr;gap:0 0}.dl b{margin-top:6px}}
@media (prefers-reduced-motion:no-preference){.opt,.day{transition:border-color .15s,background-color .15s}}
</style>

function renderBlock(b){
  if(b.h) return `<h2>${b.h}</h2>`;
  if(b.p) return `<p>${b.p}</p>`;
  if(b.ol) return `<ol class="clean">${b.ol.map(x=>`<li>${x}</li>`).join('')}</ol>`;
  if(b.table) return `<div class="tbl"><table><thead><tr>${b.table.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${
    b.table.rows.map(r=>`<tr>${r.map((c,i)=>`<td${b.table.num&&i>0?' class="num"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(b.call) return `<div class="call ${b.call==='tip'?'':b.call}"><b>${b.title}</b>${
    b.list?`<ul class="clean" style="margin-top:4px">${b.list.map(x=>`<li>${x}</li>`).join('')}</ul>`:' '+b.text}</div>`;
  if(b.bank) return `<div class="bank">${b.bank.map(g=>`<div class="bk"><div><h3>${g.name}</h3><span class="use">${g.use}</span></div>
    <span class="lbl">พูด</span><ul class="ex-list">${g.say.map(e=>`<li><span class="en">${e[0]}</span><span class="th">${e[1]}</span></li>`).join('')}</ul>
    <span class="lbl">ตอบ</span><ul class="ex-list">${g.reply.map(e=>`<li><span class="en">${e[0]}</span><span class="th">${e[1]}</span></li>`).join('')}</ul></div>`).join('')}</div>`;
  return '';
}

/* listen to a finished dialogue with the browser's English voices */
const canSpeak = typeof window!=='undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined';
function stopSpeech(){ try{ if(canSpeak) speechSynthesis.cancel(); }catch(e){} }
function speakDialogue(g,btn){
  const ss=window.speechSynthesis;
  if(ss.speaking){ ss.cancel(); btn.textContent='▶ ฟังบทสนทนา'; return; }
  const voices=ss.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  const pref=['en-US','en-GB','en-AU','en-CA'];
  const speakers=[...new Set(g.lines.map(l=>l[0]))], vmap={};
  speakers.forEach((s,i)=>{ vmap[s]={v:voices.find(v=>v.lang.replace('_','-')===pref[i%4])||voices[i%Math.max(voices.length,1)]||null, pitch:i%2?1.15:0.9}; });
  const fill=t=>t.replace(/_{2,}\((\d+)\)_{2,}/g,(m,k)=>{const it=g.items.find(x=>x._n===+k);return it?it.o[it.a]:'';});
  btn.textContent='■ หยุด';
  g.lines.forEach(([who,t],k)=>{
    const u=new SpeechSynthesisUtterance(fill(t)); const m=vmap[who];
    u.lang='en-US'; if(m.v){u.voice=m.v;u.lang=m.v.lang;} u.pitch=m.pitch; u.rate=0.95;
    if(k===g.lines.length-1) u.onend=()=>{btn.textContent='▶ ฟังบทสนทนา';};
    ss.speak(u);
  });
}

  P.innerHTML = `<div class="fc-wrap"><p class="muted">แตะการ์ดเพื่อดูความหมาย ลองนึกก่อนพลิก</p>

  const show=()=>{const v=C.vocab[i];

  $('#pv').onclick=()=>{i=(i-1+C.vocab.length)%C.vocab.length;flip=false;show()};
  $('#nx').onclick=()=>{i=(i+1)%C.vocab.length;flip=false;show()};

    d.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{

      d.querySelectorAll('.opt').forEach((x,xi)=>{x.disabled=true; if(xi===q.a)x.classList.add('right'); if(xi===j&&j!==q.a)x.classList.add('wrong'); if(xi===j)x.classList.add('sel');});

    });
    vq.appendChild(d);
  });
}

/* ---------- practice: practice mode / timed mode ---------- */
let P_state=null, timerId=null;
function drawPractice(P,C){
  const pr=C.practice, best=store.get('best'+dayState.n,null);
  clearInterval(timerId);
  P.innerHTML=`<div class="card" style="display:flex;flex-direction:column;gap:12px">
    <h3>${esc(pr.title)}</h3>
    <p class="muted">ชุดฝึกนี้เป็นโจทย์ใหม่ ไม่ซ้ำกับเอกสารในห้องเรียน${best?` · คะแนนดีที่สุดในเครื่องนี้: <b>${best}/${countItems(pr)}</b>`:''}</p>
    <div class="mode"><button class="btn primary" id="mp">โหมดฝึก (เห็นเฉลยทันที)</button><button class="btn" id="mt">โหมดจับเวลา ${pr.minutes} นาที</button></div></div>`;
  $('#mp').onclick=()=>startSet(P,C,'practice');
  $('#mt').onclick=()=>startSet(P,C,'timed');
}
const countItems = pr => pr.groups.reduce((a,g)=>a+g.items.length,0);
function startSet(P,C,mode){
  const pr=C.practice; P_state={mode,ans:{},done:false,left:pr.minutes*60};
  let n=0;
  const html=pr.groups.map((g,gi)=>{
    const pass = g.type==='dialogue'
      ? `<div class="passage"><span class="sit">Situation: ${esc(g.situation)}</span><div class="dl">${g.lines.map(l=>`<b>${esc(l[0])}:</b><span>${esc(l[1])}</span>`).join('')}</div></div>${canSpeak?`<div class="listen" data-g="${gi}" hidden></div>`:''}`
      : `<div class="passage">${g.html}</div>`;
    const qs=g.items.map(it=>{n++; it._n=n;
      return `<div class="q" data-n="${n}"><p class="stem"><span class="n">${n}.</span>${it.stem?esc(it.stem):''}</p>
        <div class="opts">${it.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="b">${L[j]}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="exp" hidden></div></div>`;}).join('');
    return `<section style="display:flex;flex-direction:column;gap:14px"><p class="eyebrow">${esc(g.label)}</p>${pass}${qs}</section>`;
  }).join('');
  P.innerHTML=`<div class="sticky"><span class="eyebrow">${mode==='timed'?'โหมดจับเวลา':'โหมดฝึก'}</span>
    ${mode==='timed'?'<span class="timer" id="tm"></span>':''}<button class="btn primary" id="sub">${mode==='timed'?'ส่งคำตอบ':'ดูสรุปผล'}</button></div>${html}<div id="res"></div>`;
  const items=pr.groups.flatMap(g=>g.items);
  P.querySelectorAll('.q').forEach(qd=>{
    const it=items[+qd.dataset.n-1];
    qd.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(P_state.done) return;
      const j=+b.dataset.j; P_state.ans[it._n]=j;
      if(mode==='practice'){ reveal(qd,it,j); }
      else qd.querySelectorAll('.opt').forEach((x,xi)=>x.classList.toggle('sel',xi===j));
    });
  });
  $('#sub').onclick=()=>finish(P,C,items);
  if(mode==='timed'){
    const tick=()=>{const m=Math.floor(P_state.left/60),s=P_state.left%60; $('#tm').textContent=`${m}:${String(s).padStart(2,'0')}`;
      if(P_state.left<=0){finish(P,C,items);return;} P_state.left--;};
    tick(); timerId=setInterval(tick,1000);
  }
}
function reveal(qd,it,j){
  qd.querySelectorAll('.opt').forEach((x,xi)=>{x.disabled=true;x.classList.toggle('sel',xi===j); if(xi===it.a)x.classList.add('right'); if(xi===j&&j!==it.a)x.classList.add('wrong');});
  const wrongs = it.o.map((o,k)=>k).filter(k=>k!==it.a);
  const why = it.x ? wrongs.map((k,ix)=>`<li>${L[k]} ผิด: ${esc(it.x[ix])}</li>`).join('')
                   : wrongs.map(k=>`<li>${L[k]} มีในโฆษณา: ${esc(it.xs[k])}</li>`).join('');
  const e=qd.querySelector('.exp'); e.hidden=false;
  e.innerHTML=`<b>${j===it.a?'ถูกต้อง':j===undefined?'ไม่ได้ตอบ · คำตอบคือ '+L[it.a]:'คำตอบคือ '+L[it.a]}</b><span>${esc(it.e)}</span><ul class="clean">${why}</ul><span class="muted" style="font-size:.85rem">${esc(it.sec)} · ${esc(it.tag)} · ระดับ${esc(it.d)}</span>`;
}
function finish(P,C,items){
  if(P_state.done) return; P_state.done=true; clearInterval(timerId);
  let score=0; const bySec={};
  items.forEach(it=>{const ok=P_state.ans[it._n]===it.a; if(ok)score++; bySec[it.sec]=bySec[it.sec]||[0,0]; bySec[it.sec][1]++; if(ok)bySec[it.sec][0]++;});
  P.querySelectorAll('.q').forEach(qd=>{const it=items[+qd.dataset.n-1]; reveal(qd,it,P_state.ans[it._n]);});
  P.querySelectorAll('.listen').forEach(el=>{
    const g=C.practice.groups[+el.dataset.g]; el.hidden=false;
    el.innerHTML='<button class="btn primary">▶ ฟังบทสนทนา</button><span class="muted" style="font-size:.88rem">ฟังฉบับเติมคำตอบแล้ว และพูดตามทีละประโยค</span>';
    const b=el.querySelector('button'); b.onclick=()=>speakDialogue(g,b);
  });
  const best=store.get('best'+dayState.n,0); if(score>best) store.set('best'+dayState.n,score);
  const done=store.get('done',{}); done[dayState.n]=true; store.set('done',done);
  const used = P_state.mode==='timed' ? ` · ใช้เวลา ${Math.round((C.practice.minutes*60-Math.max(P_state.left,0))/60)} นาที` : '';
  $('#res').innerHTML=`<div class="card" style="display:flex;flex-direction:column;gap:10px;margin-top:8px"><p class="eyebrow">สรุปผล${used}</p>
    <p class="score">${score} / ${items.length}</p>
    <div class="tbl"><table><thead><tr><th>ส่วน</th><th>ถูก</th></tr></thead><tbody>${Object.entries(bySec).map(([k,v])=>`<tr><td>${k}</td><td class="num">${v[0]} / ${v[1]}</td></tr>`).join('')}</tbody></table></div>
    <p class="muted">อ่านคำอธิบายของข้อที่ผิด แล้วบันทึกลง Error Log</p>
    <div class="row" style="justify-content:flex-start"><button class="btn primary" id="again">ทำใหม่</button></div></div>`;
  $('#again').onclick=()=>drawPractice(P,C);
  const s=$('#sub'); if(s){s.disabled=true;}
  $('#res').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ================= ROUTER ================= */
function route(){
  clearInterval(timerId); stopSpeech();
  if(location.hash==='#teacher-preview'){ store.set('preview',true); location.hash='home'; return; }
  const m=(location.hash||'').match(/^#day(\d+)$/);
  if(m && +m[1]>=1 && +m[1]<=10) renderDay(+m[1]); else renderHome();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
</script>
